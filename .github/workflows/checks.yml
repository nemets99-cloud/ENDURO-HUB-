name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  android-bundle-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx expo export --platform android
